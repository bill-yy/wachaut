<!DOCTYPE html>
<html lang="es" style="color-scheme: dark;">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="Wachaut — Comparte tu pantalla con amigos al instante. Sin registro, sin descargas. Audio incluido y funciona en cualquier navegador." />

		<!-- Icons & theme -->
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="apple-touch-icon" href="/brand-marks/apple-touch-icon.png" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="theme-color" content="#000000" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black" />

		<!-- Social (og:image MUST be absolute + PNG/JPG: WhatsApp/Facebook/LinkedIn
		     do not render SVG previews). og:title/description/url/locale are
		     emitted PER PAGE (title + og tags in svelte:head) so prerendered
		     content pages own their previews; app.html only keeps site-wide tags. -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Wachaut" />
		<meta property="og:image" content="https://wachaut.com/brand-marks/og.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="Wachaut — comparte tu pantalla al instante, sin registro" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:image" content="https://wachaut.com/brand-marks/og.png" />

		<!-- Preload fonts (self-hosted, served from /fonts/) -->
		<link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="/fonts/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin />

		<!-- No static title element here: every prerendered page sets its own
		     via svelte:head and the SPA shell (room/admin) sets one client-side
		     — a static title here produced duplicates on all content pages. -->

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<script>
			// PWA installability: register the (minimal) service worker in
			// production over HTTPS only — never on localhost/dev.
			if ('serviceWorker' in navigator && location.protocol === 'https:' && location.hostname !== 'localhost') {
				navigator.serviceWorker.register('/sw.js').catch(() => {});
			}
		</script>
	</body>
</html>
