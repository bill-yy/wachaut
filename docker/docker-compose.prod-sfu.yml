# Production SFU for wachaut.com — deployed as a Dokploy Compose in the
# "production" environment. Mirrors the Traefik label pattern of
# infra/docker-compose.prod.yml.
#
# Why Compose instead of a Dokploy Application: the RTC UDP range is native
# here (ranges are impossible to manage as per-port Application entries — the
# test-env SFU is stuck on 11 hand-added ports), restart policy is guaranteed,
# and deploys are a reliable `docker compose up -d --pull` instead of the
# flaky task-recreation path.
#
# Required environment (set in the Dokploy Compose settings, not committed):
#   TURN_SECRET            — shared secret with coturn (use-auth-secret)
#   RTC_ANNOUNCED_IP       — 167.86.110.249
# Optional:
#   ERRORS_SECRET          — lets the signaling server drain /internal/errors
#   SFU_IMAGE_TAG          — pin a sha instead of the default below
#   SFU_VIDEO_MODE         — vp9-single (RUNNING IN PROD since 2026-10-24:
#                            one full-res VP9 encode, sharper text than VP8
#                            at the same bitrate)
#                            | vp8-simulcast (pre-2026-10-24 default, 3 layers)
#                            | vp8-single | vp9-svc (encoder-dead on current
#                            Chromium — see tests/load/README.md; do not enable)
#   TURN_URL               — defaults to the VPS IP (one coturn serves both
#                            envs; avoids the cross-env hostname dependency)
#
# One-time setup checklist (outside this file):
#   1. Cloudflare DNS: sfu.wachaut.com → A 167.86.110.249, proxy ON (orange).
#   2. VPS firewall: allow udp 40000-40399.
#   3. Dokploy → production environment → New Compose, paste this file.
#      IMPORTANT: Dokploy's Traefik does NOT read docker labels — create the
#      route via the Compose's Domains UI instead: Host sfu.wachaut.com,
#      service "sfu", port 3002, HTTPS + letsencrypt. (The labels below are
#      inert here; kept for standalone-traefik deployments.)
#   4. Wachaut Web (production) build args:
#        VITE_WS_URL=wss://wachaut.com
#        VITE_SFU_URL=wss://sfu.wachaut.com
#   5. Wachaut Server (production) env: VITE_SFU_URL=https://sfu.wachaut.com
#      (runtime use only: /ready, admin health, drainSfuErrors).

services:
  sfu:
    image: ghcr.io/bill-yy/wachaut/sfu:${SFU_IMAGE_TAG:-latest}
    restart: always
    mem_limit: 1g
    cpus: 2
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - HOST=0.0.0.0
      - NUM_WORKERS=4
      - RTC_MIN_PORT=40000
      - RTC_MAX_PORT=40399
      - RTC_LISTEN_IP=0.0.0.0
      - RTC_ANNOUNCED_IP=${RTC_ANNOUNCED_IP}
      - MAX_INCOMING_BITRATE=10000000
      # Layered mode validated E2E (spike 2026-10-21): VP8 simulcast, 3
      # spatial layers. vp9-svc must NOT be used (Chromium's encoder never
      # starts — producer sits at 0 bytes/0 frames silently).
      - SFU_VIDEO_MODE=${SFU_VIDEO_MODE:-vp8-simulcast}
      # TURN: one coturn serves both envs from this VPS. Point prod at the
      # VPS IP (via env) instead of the test-env hostname, so test DNS/Cloudflare
      # changes can never break prod's relay.
      - TURN_URL=${TURN_URL:-turn:167.86.110.249:3478}
      - TURN_SECRET=${TURN_SECRET}
      - ERRORS_SECRET=${ERRORS_SECRET}
      - ALLOWED_ORIGINS=https://wachaut.com,https://www.wachaut.com,https://wadmin.wachaut.com
    ports:
      # RTC media: 400 transports ≈ ~20 full rooms. Signaling (3002) is NOT
      # published — Traefik reaches the container over dokploy-network.
      - "40000-40399:40000-40399/udp"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wachaut-prod-sfu.rule=Host(`sfu.wachaut.com`)"
      - "traefik.http.routers.wachaut-prod-sfu.entrypoints=websecure"
      - "traefik.http.routers.wachaut-prod-sfu.tls.certresolver=letsencrypt"
      - "traefik.http.services.wachaut-prod-sfu.loadbalancer.server.port=3002"
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
